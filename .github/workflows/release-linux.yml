name: Release Linux HalloweenChess

on:
  workflow_run:
    workflows: [Release Windows HalloweenChess]
    types: [completed]
  workflow_dispatch:
    inputs:
      windows_run_id:
        description: Identifiant d’une exécution Release Windows réussie
        required: true
        type: number

permissions:
  contents: read

jobs:
  linux:
    name: Compiler Linux et publier les deux ZIP standard
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      platform: linux
      upstream_run_id: ${{ github.event.workflow_run.id || inputs.windows_run_id }}
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
