name: Development HalloweenChess

on:
  workflow_run:
    workflows: [Release HalloweenChess]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag dont la release standard est déjà publiée, par exemple v1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  development:
    name: Compiler et ajouter les ZIP Development
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       github.event.workflow_run.head_sha != '')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}
      development: true
      source_commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
