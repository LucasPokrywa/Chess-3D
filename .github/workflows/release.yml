name: Release HalloweenChess

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release, par exemple v1.2.3
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      development:
        type: boolean
        default: false
      source_commit:
        type: string
        default: ''
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_LICENSE:
        required: false
      UNITY_SERIAL:
        required: false

permissions:
  contents: read

concurrency:
  group: halloweenchess-${{ inputs.development && 'development' || 'release' }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Résoudre le tag et la version Unity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      published: ${{ steps.tag.outputs.published }}
      modes: ${{ steps.tag.outputs.modes }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
      commit: ${{ steps.project.outputs.commit }}
      unity: ${{ steps.project.outputs.unity }}
    steps:
      - name: Vérifier le tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DEVELOPMENT: ${{ inputs.development == true }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] || ! git check-ref-format "refs/tags/$TAG"; then
            echo "::error::Tag invalide. Utilise un tag comme v1.2.3 ou v1.2.3-rc.1."
            exit 1
          fi

          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          if [[ ! "$tag_object" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Impossible de résoudre le tag."
            exit 1
          fi

          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s -r --arg tag "$TAG" 'add | any(.[]; .tag_name == $tag and (.draft | not))')
          if [[ "$published" == true ]]; then
            echo "Une release est déjà publiée pour $TAG."
          fi
          modes='[]'
          if [[ "$DEVELOPMENT" == true ]]; then
            if [[ "$published" != true ]]; then
              echo "::error::Publie d'abord la release standard du tag $TAG."
              exit 1
            fi
            modes='["development"]'
          elif [[ "$published" == false ]]; then
            modes='["release"]'
          fi

          prerelease=false
          case "${TAG,,}" in
            *alpha*|*beta*|*rc*) prerelease=true ;;
          esac
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "prerelease=$prerelease"
            echo "published=$published"
            echo "modes=$modes"
            echo "tag_object=$tag_object"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tag.outputs.modes != '[]'
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Lire la configuration du projet
        id: project
        if: steps.tag.outputs.modes != '[]'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TAG_OBJECT: ${{ steps.tag.outputs.tag_object }}
          PUSH_OBJECT: ${{ github.event_name == 'push' && github.event.after || '' }}
          SOURCE_COMMIT: ${{ inputs.source_commit || '' }}
        run: |
          commit=$(git rev-parse HEAD)
          if [[ "$(git rev-parse "refs/tags/$TAG")" != "$TAG_OBJECT" ]] ||
             [[ -n "$PUSH_OBJECT" && "$PUSH_OBJECT" != "$TAG_OBJECT" && "$PUSH_OBJECT" != "$commit" ]]; then
            echo "::error::Le tag a changé depuis le déclenchement."
            exit 1
          fi
          if [[ -n "$SOURCE_COMMIT" && "$commit" != "$SOURCE_COMMIT" ]]; then
            echo "::error::Le tag ne pointe plus vers le commit compilé par la release standard."
            exit 1
          fi
          unity=$(awk '/^m_EditorVersion: / { sub(/\r$/, "", $2); print $2 }' ProjectSettings/ProjectVersion.txt)
          if [[ ! "$unity" =~ ^[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+$ ]]; then
            echo "::error::Version Unity introuvable ou invalide dans ProjectSettings/ProjectVersion.txt."
            exit 1
          fi
          {
            echo "commit=$commit"
            echo "unity=$unity"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $TAG, commit $commit, Unity $unity"

  checks:
    name: Vérifications Unity existantes
    needs: prepare
    if: needs.prepare.outputs.modes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Vérifier la configuration de la licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]] ||
             [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]] ||
             [[ -n "$UNITY_LICENSE" && -n "$UNITY_SERIAL" ]]; then
            echo "::error::Configure UNITY_EMAIL et UNITY_PASSWORD, puis UNITY_LICENSE ou UNITY_SERIAL selon ta licence."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          lfs: true
          persist-credentials: false

      - name: Faire de la place pour l’image Unity
        run: |
          sudo rm -rf -- /usr/local/lib/android
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: unity-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.unity }}-StandaloneLinux64-checks-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}-${{ needs.prepare.outputs.commit }}
          restore-keys: |
            unity-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.unity }}-StandaloneLinux64-checks-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}-

      - name: Préparer le lanceur des contrôles existants
        run: |
          mkdir -p Assets/Editor
          cat > Assets/Editor/HalloweenChessReleaseChecks.cs <<'CSHARP'
          using System;
          using System.Reflection;
          using UnityEditor;
          using UnityEngine;

          public static class HalloweenChessReleaseChecks
          {
              public static void Run()
              {
                  int code = 0;
                  void Surveiller(string message, string trace, LogType type)
                  {
                      if (type == LogType.Error || type == LogType.Assert || type == LogType.Exception)
                          code = 1;
                  }

                  Application.logMessageReceived += Surveiller;
                  try
                  {
                      var controles = new (string Classe, string Methode)[]
                      {
                          ("ChessRulesChecks", "Run"),
                          ("EvaluationChecks", "Run"),
                          ("EvaluationIncrementaleChecks", "Run"),
                          ("MoveOrderingChecks", "Run"),
                          ("TranspositionChecks", "Run"),
                          ("IABenchmark", "VerifierCompteurs"),
                          ("TestBudgetIA", "TesterSuitesQuietude")
                      };
                      foreach (var controle in controles)
                      {
                          var classe = typeof(HalloweenChessReleaseChecks).Assembly.GetType(controle.Classe);
                          var methode = classe?.GetMethod(controle.Methode,
                              BindingFlags.Public | BindingFlags.NonPublic | BindingFlags.Static);
                          if (methode == null)
                          {
                              Debug.Log($"[Release] Contrôle absent de ce tag : {controle.Classe}.{controle.Methode}");
                              continue;
                          }

                          Debug.Log($"[Release] {controle.Classe}.{controle.Methode}");
                          methode.Invoke(null, null);
                      }
                  }
                  catch (Exception erreur)
                  {
                      code = 1;
                      Debug.LogException(erreur is TargetInvocationException appel && appel.InnerException != null
                          ? appel.InnerException : erreur);
                  }
                  finally
                  {
                      Application.logMessageReceived -= Surveiller;
                  }
                  Debug.Log($"[Release] Fin des contrôles, code {code}.");
                  EditorApplication.Exit(code);
              }
          }
          CSHARP

      # Ces contrôles sont des méthodes Editor. Le buildMethod exécute leur lanceur sans produire de Player.
      - name: Exécuter les contrôles dans Unity
        uses: game-ci/unity-builder@81ed299e10d0ca8f55616c5c74505ffce511163c # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.prepare.outputs.unity }}
          targetPlatform: StandaloneLinux64
          buildMethod: HalloweenChessReleaseChecks.Run
          versioning: None
          allowDirtyBuild: true
          runAsHostUser: true

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.mode }})
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.UNITY_SERIALIZE_BUILDS == 'true' && 1 || 2 }}
      matrix:
        mode: ${{ fromJSON(needs.prepare.outputs.modes) }}
        target: [StandaloneWindows64, StandaloneLinux64]
        include:
          - target: StandaloneWindows64
            platform: Windows-x64
            executable: HalloweenChess.exe
            player: UnityPlayer.dll
          - target: StandaloneLinux64
            platform: Linux-x64
            executable: HalloweenChess
            player: UnityPlayer.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          lfs: true
          persist-credentials: false

      - name: Faire de la place pour l’image Unity
        run: |
          sudo rm -rf -- /usr/local/lib/android
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: unity-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.unity }}-${{ matrix.target }}${{ matrix.mode == 'development' && '-development' || '' }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}-${{ needs.prepare.outputs.commit }}
          restore-keys: |
            unity-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.unity }}-${{ matrix.target }}${{ matrix.mode == 'development' && '-development' || '' }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}-

      # Le lanceur est fourni par le workflow pour fonctionner aussi avec les anciens tags.
      - name: Préparer le lanceur Development
        if: matrix.mode == 'development'
        run: |
          mkdir -p Assets/Editor
          cat > Assets/Editor/HalloweenChessDevelopmentBuild.cs <<'CSHARP'
          using System;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;

          public static class HalloweenChessDevelopmentBuild
          {
              public static void Run()
              {
                  var cible = (BuildTarget)Enum.Parse(typeof(BuildTarget), Argument("-buildTarget"));
                  var options = new BuildPlayerOptions
                  {
                      target = cible,
                      locationPathName = Argument("-customBuildPath"),
                      scenes = EditorBuildSettings.scenes.Where(scene => scene.enabled).Select(scene => scene.path).ToArray(),
                      options = BuildOptions.Development | BuildOptions.AllowDebugging
                  };

                  string versionAvant = PlayerSettings.bundleVersion;
                  try
                  {
                      PlayerSettings.bundleVersion = Argument("-buildVersion");
                      BuildSummary bilan = BuildPipeline.BuildPlayer(options).summary;
                      Console.WriteLine($"Build {cible} {bilan.options} : {bilan.result}, {bilan.totalErrors} erreur(s).");
                      if (bilan.result != BuildResult.Succeeded)
                          throw new InvalidOperationException($"Échec du build Development pour {cible}.");
                  }
                  finally
                  {
                      PlayerSettings.bundleVersion = versionAvant;
                  }
              }

              private static string Argument(string nom)
              {
                  string[] arguments = Environment.GetCommandLineArgs();
                  int index = Array.IndexOf(arguments, nom);
                  if (index < 0 || index + 1 >= arguments.Length || arguments[index + 1].StartsWith("-", StringComparison.Ordinal))
                      throw new ArgumentException($"Argument Unity manquant : {nom}.");
                  return arguments[index + 1];
              }
          }
          CSHARP

      - name: Compiler avec GameCI
        uses: game-ci/unity-builder@81ed299e10d0ca8f55616c5c74505ffce511163c # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.prepare.outputs.unity }}
          targetPlatform: ${{ matrix.target }}
          buildName: HalloweenChess
          buildsPath: build
          buildMethod: ${{ matrix.mode == 'development' && 'HalloweenChessDevelopmentBuild.Run' || '' }}
          allowDirtyBuild: ${{ matrix.mode == 'development' }}
          versioning: Custom
          version: ${{ needs.prepare.outputs.version }}
          androidVersionCode: '0' # Les cibles de ce workflow sont uniquement desktop.
          runAsHostUser: true

      - name: Archiver et vérifier le build complet
        id: archive
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          MODE: ${{ matrix.mode }}
          EXECUTABLE: ${{ matrix.executable }}
          PLAYER: ${{ matrix.player }}
        run: |
          build="$GITHUB_WORKSPACE/build/$TARGET"
          suffix=
          if [[ "$MODE" == development ]]; then
            suffix=-Development
          fi
          archive="release/HalloweenChess-$TAG-$PLATFORM$suffix.zip"
          if [[ "$TARGET" == StandaloneLinux64 && ! -s "$build/$EXECUTABLE" ]]; then
            EXECUTABLE="$EXECUTABLE.x86_64"
          fi
          if [[ ! -s "$build/$EXECUTABLE" || ! -s "$build/$PLAYER" || ! -d "$build/HalloweenChess_Data" ]]; then
            echo "::error::Le build Unity est incomplet dans $build."
            exit 1
          fi
          if [[ "$TARGET" == StandaloneLinux64 ]]; then
            file -b "$build/$EXECUTABLE" | grep -Eq '^ELF 64-bit.*x86-64'
            chmod a+x "$build/$EXECUTABLE"
          else
            file -b "$build/$EXECUTABLE" | grep -Eq '^PE32\+.*x86-64'
          fi
          mkdir -p "$(dirname "$archive")"
          (cd "$build" && zip -qry "$GITHUB_WORKSPACE/$archive" .)
          unzip -tq "$archive"
          if [[ "$TARGET" == StandaloneLinux64 ]]; then
            zipinfo -l "$archive" "$EXECUTABLE" | grep -Eq '^-[rwx-]{2}x'
          fi
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Stocker l’archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.mode == 'development' && 'development' || 'build' }}-${{ matrix.platform }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  publish:
    name: Publier ou compléter la release GitHub
    needs: [prepare, build]
    if: needs.prepare.outputs.modes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Télécharger les ZIP standard
        if: needs.prepare.outputs.published == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: release
          merge-multiple: true

      - name: Télécharger les ZIP Development
        if: contains(fromJSON(needs.prepare.outputs.modes), 'development')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: development-*
          path: release
          merge-multiple: true

      - name: Ajouter les archives au tag sélectionné
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PUBLISHED_AT_PREPARE: ${{ needs.prepare.outputs.published }}
          DEVELOPMENT: ${{ contains(fromJSON(needs.prepare.outputs.modes), 'development') }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          archives_dev=()
          if [[ "$DEVELOPMENT" == true ]]; then
            archives_dev=("release/HalloweenChess-$TAG-Windows-x64-Development.zip"
                          "release/HalloweenChess-$TAG-Linux-x64-Development.zip")
          fi

          verifier_tag() {
            if [[ "$(gh api "$repo/git/ref/tags/$TAG" --jq '.object.sha')" != "$TAG_OBJECT" ]]; then
              echo "::error::Le tag a changé depuis la préparation."
              exit 1
            fi
          }

          lister_archives() {
            gh api --paginate "$repo/releases/$1/assets?per_page=100" | jq -cs 'add'
          }

          archive_presente() {
            local liste="$1" fichier="$2" taille="${3:-0}"
            jq -e --arg nom "${fichier##*/}" --argjson taille "$taille" '
              any(.[]; .name == $nom and .state == "uploaded" and .size > 0 and ($taille == 0 or .size == $taille))
            ' <<< "$liste" > /dev/null
          }

          verifier_archives_locales() {
            local archive
            for archive in "$@"; do
              if [[ ! -s "$archive" ]]; then
                echo "::error::Archive manquante : $archive"
                exit 1
              fi
            done
          }

          verifier_upload() {
            local liste="$1" archive
            shift
            for archive in "$@"; do
              if ! archive_presente "$liste" "$archive" "$(stat -c %s "$archive")"; then
                echo "::error::Téléversement incomplet : $archive"
                exit 1
              fi
            done
          }

          verifier_tag
          release=$(gh api --paginate "$repo/releases?per_page=100" |
            jq -cs --arg tag "$TAG" 'add | map(select(.tag_name == $tag)) | sort_by(.draft) | first // null')
          etat=$(jq -r '.draft' <<< "$release")
          if [[ "$etat" == true ]]; then
            echo "::error::Un brouillon existe déjà pour $TAG. Vérifie-le avant de relancer."
            exit 1
          fi

          if [[ "$etat" == false ]]; then
            verifier_archives_locales "${archives_dev[@]}"
            release_id=$(jq -r '.id' <<< "$release")
            liste=$(lister_archives "$release_id")
            a_ajouter=()
            for archive in "${archives_dev[@]}"; do
              if archive_presente "$liste" "$archive"; then
                echo "Archive déjà publiée : ${archive##*/}"
              else
                a_ajouter+=("$archive")
              fi
            done
            if (( ${#a_ajouter[@]} > 0 )); then
              if [[ "$(jq -r '.immutable' <<< "$release")" == true ]]; then
                echo "::error::La release $TAG est immuable. Les archives de cette exécution sont dans Artifacts."
                exit 1
              fi
              verifier_tag
              gh release upload "$TAG" "${a_ajouter[@]}" --repo "$GITHUB_REPOSITORY"
              liste=$(lister_archives "$release_id")
              verifier_upload "$liste" "${a_ajouter[@]}"
            fi
            verifier_tag
            jq -r '.html_url' <<< "$release"
            exit 0
          fi

          if [[ "$PUBLISHED_AT_PREPARE" == true ]]; then
            echo "::error::La release $TAG a disparu depuis la préparation."
            exit 1
          fi
          archives=("release/HalloweenChess-$TAG-Windows-x64.zip"
                    "release/HalloweenChess-$TAG-Linux-x64.zip"
                    "${archives_dev[@]}")
          verifier_archives_locales "${archives[@]}"
          verifier_tag

          brouillon=
          nettoyer() {
            if [[ -n "$brouillon" && "$(gh api "$repo/releases/$brouillon" --jq '.draft')" == true ]]; then
              gh api --method DELETE "$repo/releases/$brouillon" ||
                echo "::warning::Le brouillon $brouillon doit être retiré manuellement."
            fi
          }
          trap nettoyer EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          brouillon=$(gh api --method POST "$repo/releases" \
            --raw-field tag_name="$TAG" --raw-field name="$TAG" \
            --field draft=true --field prerelease="$PRERELEASE" --field generate_release_notes=true --jq '.id')
          gh release upload "$TAG" "${archives[@]}" --repo "$GITHUB_REPOSITORY"

          liste=$(lister_archives "$brouillon")
          verifier_upload "$liste" "${archives[@]}"
          verifier_tag
          gh api --method PATCH "$repo/releases/$brouillon" --field draft=false --jq '.html_url'
          brouillon=
